services:
  # The Node.js Backend Service
  - type: web
    name: backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hopebridge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  # The React/Nginx Frontend Service
  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # No extra env vars needed since nginx routes to 'http://backend:5000' internally

databases:
  # Managed PostgreSQL Database
  - name: hopebridge-db
    databaseName: hopebridge
    user: user
